[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Single-threaded on purpose. GitHub Pages cannot set the COOP/COEP headers
; that SharedArrayBuffer requires, and mobile Safari / Firefox Android do not
; support the threaded path at all. This trades some performance for "runs
; anywhere with no special headers", which is the whole point of this channel.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>(function(){var s=document.createElement('style');s.textContent='#oog-rot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;display:none;align-items:center;justify-content:center;background:#0b1017;color:#cfd8e3;font:600 18px system-ui,-apple-system,sans-serif;text-align:center;padding:24px}@media (orientation:portrait){#oog-rot{display:flex}}';document.head.appendChild(s);function hint(){var d=document.createElement('div');d.id='oog-rot';d.textContent='Rotate your device to landscape';document.body.appendChild(d);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',hint);}else{hint();}function lock(){var e=document.documentElement;var p=e.requestFullscreen?e.requestFullscreen():null;var after=function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}};if(p&&p.then){p.then(after).catch(after);}else{after();}}function once(){lock();window.removeEventListener('pointerdown',once);window.removeEventListener('touchend',once);}window.addEventListener('pointerdown',once);window.addEventListener('touchend',once);})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false


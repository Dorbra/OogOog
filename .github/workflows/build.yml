name: build

# This project is developed without a local machine. CI is not a safety net
# bolted on beside a dev loop — it IS the dev loop. A green run therefore has to
# mean more than "it compiled": it validates, then publishes to two channels.
#
#   Channel A (web)  -> GitHub Pages, ~2 min, no install. Iterate here.
#   Channel B (apk)  -> a GitHub Release with a stable URL. The source of truth.
#
# Publishing targets differ by event:
#   pull_request -> pr-<n> prerelease + a sticky comment, and a web preview at
#                   /pr/<n>/, so a branch can be played BEFORE it is merged.
#   push to main -> the rolling `dev` release everyone bookmarks, and the web
#                   build at the site root.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` and `id-token: write` are deliberately absent: the web build is
# published by pushing a branch, not through the Pages deployment API. See the
# publish-web job — that difference is the entire point of this arrangement.
permissions:
  contents: write
  pull-requests: write

# Per-ref, so a new push supersedes an in-flight run for the same branch.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.stamp.outputs.apk_name }}
      short_sha: ${{ steps.stamp.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TPL"/

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # Verifies the pinned version actually matches .godot-version, so the
      # repo and CI can never silently drift apart.
      - name: Verify pinned engine version
        run: |
          set -euo pipefail
          PINNED="$(tr -d '[:space:]' < .godot-version)"
          if [ "$PINNED" != "$GODOT_VERSION" ]; then
            echo "::error::.godot-version ($PINNED) != workflow GODOT_VERSION ($GODOT_VERSION)"
            exit 1
          fi
          godot --headless --version

      # Stamps the commit into the build so the running app on the phone can
      # identify itself. With a shared web preview that can be overwritten by
      # another branch's build, this is what tells you which build you are on.
      - name: Write build stamp
        id: stamp
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          cat > data/build_stamp.json <<EOF
          {
            "commit": "${SHORT}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": "${GITHUB_RUN_NUMBER}"
          }
          EOF
          cat data/build_stamp.json
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "apk_name=oogoog-${SHORT}.apk" >> "$GITHUB_OUTPUT"

      - name: Lint (gdtoolkit)
        run: |
          python3 -m pip install --quiet "gdtoolkit==4.*"
          gdformat --check $(git ls-files '*.gd') || {
            echo "::error::gdformat found unformatted files — run gdformat on them"
            exit 1
          }
          gdlint $(git ls-files '*.gd')

      # Builds the .godot/ import cache. Skipping this is the classic cause of
      # a green build that produces a broken artifact.
      - name: Import resources
        run: godot --headless --path . --import

      # Pure sim logic verified without a display — the one form of correctness
      # checking available when nobody involved can run the game locally.
      - name: Unit tests
        run: godot --headless --path . --script tools/run_tests.gd

      - name: Smoke test (headless boot)
        run: ./tools/smoke_test.sh "$(command -v godot)" 300

      # Runs the real publish script against a local bare repo. The properties
      # it proves are the ones that are expensive to get wrong on the actual
      # branch: a root publish must not delete the previews of open PRs, and
      # history must stay at one commit.
      - name: Web publish logic tests
        run: bash tests/test_publish_web.sh

      # The headless smoke test never calls _draw(), so without this the whole
      # rendering path is unverified. The combat capture additionally drives a
      # real shot and captures on impact, exercising the feedback layer.
      - name: Render tests + screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
          ./tools/render_test.sh "$(command -v godot)" 90 build/shot.png idle
          ./tools/render_test.sh "$(command -v godot)" 240 build/combat.png combat

      # Everything above this line runs the project FROM SOURCE, where every data
      # file is sitting on disk. That is exactly how a missing arena_01.txt
      # reached a phone: .txt is not a "resource", so the export dropped it, and
      # nothing here noticed because nothing here looks inside the artifact.
      - name: Verify the exported pack contains its data files
        run: ./tools/verify_pack.sh "$(command -v godot)" Web

      - name: Export web (single-threaded)
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-debug "Web" build/web/index.html
          test -s build/web/index.wasm
          ls -la build/web

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug keystore
        run: |
          set -euo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # Godot finds the SDK through an editor setting, not an env var, so the
      # settings file has to be written before a headless Android export.
      - name: Point Godot at the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using SDK at $SDK"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" \
            "build/android/${{ steps.stamp.outputs.apk_name }}"
          ls -la build/android
          test -s "build/android/${{ steps.stamp.outputs.apk_name }}"

      # Android is a SEPARATE export preset with its own filters, so verifying
      # the web pack does not prove anything about the APK. Extracting rather
      # than grepping the .apk directly, because the pack may be deflated inside
      # the zip and a raw grep would silently find nothing and "pass".
      - name: Verify the APK contains the arena
        run: |
          set -euo pipefail
          APK="build/android/${{ steps.stamp.outputs.apk_name }}"
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" -d /tmp/apkcheck
          if grep -raq "data/arenas/arena_01.txt" /tmp/apkcheck; then
            echo "arena is packaged in the APK"
          else
            echo "::error::arena_01.txt is not inside ${APK}."
            echo "::error::The Android preset needs *.txt in its include_filter."
            echo "::error::Shipping without it renders as a grey void — no walls,"
            echo "::error::no spawns, world size zero."
            exit 1
          fi

      # A plain artifact, NOT actions/upload-pages-artifact. The publish-web job
      # pushes these files to a branch rather than handing them to the Pages
      # deployment API, so the special tar-and-hash format that action produces
      # buys nothing here.
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ steps.stamp.outputs.short_sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.stamp.outputs.short_sha }}
          path: |
            build/android/*.apk
            build/shot.png
            build/combat.png
          if-no-files-found: error

      # ---- Publish: pull request ------------------------------------------
      # Each PR gets its own tag, so two open PRs never fight over one release.
      - name: Publish PR build
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          TAG="pr-${PR}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "PR #${PR} — ${{ steps.stamp.outputs.short_sha }}" \
            --notes "Build for pull request #${PR} at \`${{ steps.stamp.outputs.short_sha }}\` (run #${GITHUB_RUN_NUMBER}). Not for merging — this tag is replaced on every push to the PR." \
            --prerelease \
            --target "${{ github.event.pull_request.head.sha }}" \
            build/android/*.apk build/shot.png build/combat.png

      - name: Comment APK link on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          APK="${{ steps.stamp.outputs.apk_name }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/pr-${PR}/${APK}"
          BODY=$(cat <<EOF
          ### 📱 Build ready — \`${{ steps.stamp.outputs.short_sha }}\`

          | | |
          |---|---|
          | **Install on phone** | [\`${APK}\`](${URL}) |
          | **Play in browser** | https://dorbra.github.io/OogOog/pr/${PR}/ |
          | **Screenshots** | [idle](https://github.com/${GITHUB_REPOSITORY}/releases/download/pr-${PR}/shot.png) · [combat](https://github.com/${GITHUB_REPOSITORY}/releases/download/pr-${PR}/combat.png) |

          Both are **this PR**, not \`main\`. The preview lives in its own
          directory on the \`gh-pages\` branch, so it cannot overwrite the site
          root and two open PRs cannot overwrite each other. It is removed when
          this PR closes.

          The browser build is single-threaded and its timing does not match the
          device — **judge performance on the APK only**. If you need to confirm
          which build you are looking at, the commit hash is in the in-game HUD
          under DBG → Info.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          # One sticky comment per PR, edited in place, rather than a new comment
          # on every push turning the thread into a wall of build noise.
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("📱 Build ready")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -f body="$BODY" >/dev/null
            echo "updated comment $EXISTING"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" >/dev/null
            echo "created new comment"
          fi

      # ---- Publish: main ---------------------------------------------------
      - name: Publish rolling dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev \
            --title "Dev build ${{ steps.stamp.outputs.apk_name }}" \
            --notes "Latest build from \`main\` (${{ steps.stamp.outputs.short_sha }}), run #${GITHUB_RUN_NUMBER}.

          Install the APK below on your phone. The browser build is published to this repo's GitHub Pages URL." \
            --prerelease \
            build/android/*.apk build/shot.png build/combat.png

  # Publishes the web build by PUSHING A BRANCH, not through the Pages
  # deployment API.
  #
  # The API route runs the job inside the `github-pages` environment, and that
  # environment carries a deployment-branch policy. This repository's policy was
  # pinned to `claude/godot-archer-arena` — whichever branch happened to be
  # default when Pages was first configured — and making `main` the default
  # branch later did not update it. Every deploy from `main` was refused before
  # the job's first step, producing a one-second failure with no steps and no
  # downloadable log, while `continue-on-error` reported the run green. The site
  # served a stale build for hours and nothing said so.
  #
  # Pushing a branch needs `contents: write` and nothing else. No environment, no
  # branch policy, no gate that can refuse a job before it starts. It also gives
  # every pull request its own directory, which ends the last-writer-wins problem
  # a single shared site always had.
  #
  # The concurrency group is shared with pages-cleanup.yml on purpose: every run
  # force-pushes the SAME branch, so they have to queue. cancel-in-progress is
  # false because a superseded publish must still finish rather than leave the
  # branch half-written.
  publish-web:
    needs: build
    if: >-
      github.event_name != 'workflow_dispatch'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/publish_web.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: web-${{ needs.build.outputs.short_sha }}
          path: web

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          # An `if`, not `[ … ] && DEST=…`: under `set -e` that form exits the
          # step when the test is false and it happens to be the last line.
          DEST=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            DEST="pr/${PR}"
          fi
          ./tools/publish_web.sh publish \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${DEST}" web \
            "web: ${DEST:-root} at ${SHA} (run #${GITHUB_RUN_NUMBER})"

      # The whole incident this job exists to fix was a publish that reported
      # success while the site stayed stale, so the run does not get to claim
      # success until the site actually answers. GitHub's own build lags the push
      # by 30-60s, hence the poll.
      #
      # Until Settings -> Pages -> Source is set to "Deploy from a branch ->
      # gh-pages / (root)", this step fails. That is correct: at that point the
      # build genuinely is not reaching anybody.
      - name: Verify the site is live
        env:
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          URL="https://dorbra.github.io/OogOog/"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            URL="${URL}pr/${PR}/"
          fi
          echo "polling ${URL}"
          for attempt in $(seq 1 15); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "  attempt ${attempt}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "site is live at ${URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${URL} never returned 200. The branch push succeeded, so"
          echo "::error::this is the Pages source setting: Settings -> Pages ->"
          echo "::error::Source -> Deploy from a branch -> gh-pages / (root)."
          echo "::error::Also clear Settings -> Environments -> github-pages ->"
          echo "::error::Deployment branches -> No restriction, or GitHub's own"
          echo "::error::pages-build-deployment job is refused the same way."
          exit 1
